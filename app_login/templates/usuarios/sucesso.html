<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Bem-Sucedido</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center text-success">Upload realizado com sucesso!</h1>
        <p class="text-center">O arquivo foi enviado para:</p>
        <p class="text-center">
            <a href="{{ uploaded_file_url }}" class="btn btn-link">{{ uploaded_file_url }}</a>
        </p>
        <div class="text-center mt-4">
            <a href="{% url 'listagem_usuarios' %}" class="btn btn-primary">Voltar</a>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
