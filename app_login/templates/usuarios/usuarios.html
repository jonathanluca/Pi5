<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Vídeo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .table-container {
            margin: 50px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .table th {
            background-color: #007bff;
            color: white;
        }
        .table td, .table th {
            text-align: center;
            vertical-align: middle;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-add {
            margin-bottom: 20px;
        }
        .upload-container {
            margin-top: 50px;
            text-align: center;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Upload de Vídeo</h1>
        <div class="upload-container">
            <form method="post" enctype="multipart/form-data" action="{% url 'upload_video' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="videoFile" class="form-label">Selecione um vídeo para upload:</label>
                    <input type="file" class="form-control" id="videoFile" name="video">
                </div>
                <button type="submit" class="btn btn-success">Enviar Vídeo</button>
            </form>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
